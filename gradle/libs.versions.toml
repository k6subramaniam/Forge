[versions]
# Conservative, mutually compatible set (verified against Maven/Google Maven metadata):
# AGP 8.9.1 is the floor set by Health Connect 1.1.0's AAR metadata (minAndroidGradlePluginVersion
# 8.9.1, minCompileSdk 36); AGP 8.9.x needs Gradle 8.11.1+ and JDK 17, and supports compileSdk 36.
# Kotlin 2.0.21 ships the Compose compiler plugin (and matches Health Connect 1.1.0's kotlin-stdlib);
# Compose BOM 2024.12.01 = Compose 1.7.x; Wear Compose 1.4.1 and Horologist 0.6.23 are
# contemporaneous (Horologist 0.6.23's POM targets Wear Compose 1.4.1 exactly).
agp = "8.9.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
wearCompose = "1.4.1"
horologist = "0.6.23"
healthConnect = "1.1.0"
junit = "5.11.3"
junitPlatform = "1.11.3"
# Storage (phone): Room 2.6.1 with KSP. KSP versions are pinned to the Kotlin version
# (2.0.21-1.0.x). Room 2.6.1 needs compileSdk 34+ and pulls no newer kotlin-stdlib than 2.0.21.
room = "2.6.1"
ksp = "2.0.21-1.0.28"
# :mobile unit tests run on the JVM via Robolectric (Room against a real SQLite).
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
junit4 = "4.13.2"
coroutines = "1.7.3"
# Phone ↔ watch sync (blueprint 3.6). kotlinx-serialization 1.7.3 is built with
# Kotlin 2.0.20 (1.8.x needs Kotlin 2.1). play-services-wearable 19.0.0 is the
# Data Layer contemporaneous with this stack.
serialization = "1.7.3"
playServicesWearable = "19.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
horologist-compose-layout = { group = "com.google.android.horologist", name = "horologist-compose-layout", version.ref = "horologist" }

androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
# Task.await() for the Data Layer calls; same version as the coroutines already in use.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
